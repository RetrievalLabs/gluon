schema_version: 1
target_java: 25
verified_on: "2026-08-16"
description: >
  Dependency compatibility rules for Java 8 to Java 25 migrations. Rules are
  intentionally conservative and focus on dependencies known to inspect,
  generate, or deeply integrate with bytecode, javac, or major frameworks.
coverage_policy:
  mode: curated_and_inventory_driven
  exhaustive_all_maven_artifacts: false
  unknown_dependency:
    severity: info
    risk: needs_source_verification
    compatibility:
      java:
        "25":
          min_version: "unknown"
          recommended_version: "do-not-upgrade-blindly"
          supported_versions: []
          unsupported_versions: []
    guidance: >
      If a resolved dependency has no matching rule, keep declared version unless
      build/tests fail, security policy requires an update, or official project
      docs/release notes identify a Java 25 compatibility boundary. Add a
      project-family rule before automated migration changes it.
