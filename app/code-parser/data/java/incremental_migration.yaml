schema_version: 1
source_java: 8
target_java: 25
verified_on: "2026-08-16"
description: >
  Incremental Java 8 to Java 25 migration guide. Entries are release-oriented
  and focus on changes that affect source edits, build configuration, runtime
  flags, testing, and modernization opportunities.
coverage_policy:
  mode: curated_migration_relevant_changes
  exhaustive_all_jeps: false
  guidance: >
    Use this file to plan staged migrations and code edits. It does not replace
    compiler diagnostics, jdeprscan, jdeps, release notes, or application tests.
    Preview/incubator features are modernization opportunities, not required
    migration edits unless project already uses them.
