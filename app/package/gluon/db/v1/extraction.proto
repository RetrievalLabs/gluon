syntax = "proto3";

package gluon.db.v1;

import "gluon/db/v1/sqlite.proto";

// Shared contract for extraction.db.

enum ExtractionTable {
  EXTRACTION_TABLE_UNSPECIFIED = 0;
  EXTRACTION_TABLE_MODULES = 1;
  EXTRACTION_TABLE_CLASSES = 2;
  EXTRACTION_TABLE_METHODS = 3;
  EXTRACTION_TABLE_RELATIONSHIPS = 4;
  EXTRACTION_TABLE_ENTRY_POINTS = 5;
  EXTRACTION_TABLE_CANDIDATE_SCORES = 6;
  EXTRACTION_TABLE_CANDIDATE_SIGNALS = 7;
  EXTRACTION_TABLE_EVIDENCE_RANGES = 8;
  EXTRACTION_TABLE_CONTEXT_PACKETS = 9;
  EXTRACTION_TABLE_DIAGNOSTICS = 10;
  EXTRACTION_TABLE_TEST_SUITES = 11;
  EXTRACTION_TABLE_TEST_CASES = 12;
  EXTRACTION_TABLE_TEST_TARGETS = 13;
  EXTRACTION_TABLE_TEST_ASSERTIONS = 14;
  EXTRACTION_TABLE_TEST_FIXTURES = 15;
  EXTRACTION_TABLE_TEST_ENTRY_POINTS = 16;
  EXTRACTION_TABLE_TEST_DIAGNOSTICS = 17;
}

message ModuleRow {
  option (sqlite_table).name = "modules";

  string id = 1 [(sqlite_column) = { sql_type: "TEXT" primary_key: true }];
  string name = 2 [(sqlite_column) = { sql_type: "TEXT" not_null: true }];
  string path = 3 [(sqlite_column) = { sql_type: "TEXT" not_null: true }];
  optional string build_system = 4 [(sqlite_column).sql_type = "TEXT"];
  optional string build_file = 5 [(sqlite_column).sql_type = "TEXT"];
  optional string parent_id = 6 [(sqlite_column).sql_type = "TEXT"];
}

message ClassRow {
  option (sqlite_table).name = "classes";

  string id = 1 [(sqlite_column) = { sql_type: "TEXT" primary_key: true }];
  string module_id = 2 [(sqlite_column) = { sql_type: "TEXT" not_null: true }];
  string name = 3 [(sqlite_column) = { sql_type: "TEXT" not_null: true }];
  optional string package_name = 4 [(sqlite_column).sql_type = "TEXT"];
  string qualified_name = 5 [(sqlite_column) = { sql_type: "TEXT" not_null: true }];
  string kind = 6 [(sqlite_column) = { sql_type: "TEXT" not_null: true }];
  string file = 7 [(sqlite_column) = { sql_type: "TEXT" not_null: true }];
  int64 start_line = 8 [(sqlite_column) = { sql_type: "INTEGER" not_null: true }];
  int64 end_line = 9 [(sqlite_column) = { sql_type: "INTEGER" not_null: true }];
  optional string superclass = 10 [(sqlite_column).sql_type = "TEXT"];
  string interfaces_json = 11 [(sqlite_column) = { sql_type: "TEXT" not_null: true }];
  string annotations_json = 12 [(sqlite_column) = { sql_type: "TEXT" not_null: true }];
}

message MethodRow {
  option (sqlite_table).name = "methods";

  string id = 1 [(sqlite_column) = { sql_type: "TEXT" primary_key: true }];
  string module_id = 2 [(sqlite_column) = { sql_type: "TEXT" not_null: true }];
  string class_id = 3 [(sqlite_column) = { sql_type: "TEXT" not_null: true }];
  string name = 4 [(sqlite_column) = { sql_type: "TEXT" not_null: true }];
  string signature = 5 [(sqlite_column) = { sql_type: "TEXT" not_null: true }];
  optional string return_type = 6 [(sqlite_column).sql_type = "TEXT"];
  string parameters_json = 7 [(sqlite_column) = { sql_type: "TEXT" not_null: true }];
  string annotations_json = 8 [(sqlite_column) = { sql_type: "TEXT" not_null: true }];
  string file = 9 [(sqlite_column) = { sql_type: "TEXT" not_null: true }];
  int64 start_line = 10 [(sqlite_column) = { sql_type: "INTEGER" not_null: true }];
  int64 end_line = 11 [(sqlite_column) = { sql_type: "INTEGER" not_null: true }];
  int64 name_line = 12 [(sqlite_column) = { sql_type: "INTEGER" not_null: true }];
  int64 name_column = 13 [(sqlite_column) = { sql_type: "INTEGER" not_null: true }];
}

message RelationshipRow {
  option (sqlite_table).name = "relationships";

  int64 id = 1 [(sqlite_column) = { sql_type: "INTEGER" primary_key: true autoincrement: true }];
  string source_id = 2 [(sqlite_column) = { sql_type: "TEXT" not_null: true }];
  string target_id = 3 [(sqlite_column) = { sql_type: "TEXT" not_null: true }];
  string kind = 4 [(sqlite_column) = { sql_type: "TEXT" not_null: true }];
  double confidence = 5 [(sqlite_column) = { sql_type: "REAL" not_null: true }];
  string source = 6 [(sqlite_column) = { sql_type: "TEXT" not_null: true }];
}

message EntryPointRow {
  option (sqlite_table).name = "entry_points";

  string id = 1 [(sqlite_column) = { sql_type: "TEXT" primary_key: true }];
  string method_id = 2 [(sqlite_column) = { sql_type: "TEXT" not_null: true }];
  string kind = 3 [(sqlite_column) = { sql_type: "TEXT" not_null: true }];
  optional string framework = 4 [(sqlite_column).sql_type = "TEXT"];
  optional string route = 5 [(sqlite_column).sql_type = "TEXT"];
  optional string http_method = 6 [(sqlite_column).sql_type = "TEXT"];
  string source = 7 [(sqlite_column) = { sql_type: "TEXT" not_null: true }];
}

message CandidateScoreRow {
  option (sqlite_table).name = "candidate_scores";

  string method_id = 1 [(sqlite_column) = { sql_type: "TEXT" primary_key: true }];
  int64 score = 2 [(sqlite_column) = { sql_type: "INTEGER" not_null: true }];
  string priority = 3 [(sqlite_column) = { sql_type: "TEXT" not_null: true }];
}

message CandidateSignalRow {
  option (sqlite_table).name = "candidate_signals";

  int64 id = 1 [(sqlite_column) = { sql_type: "INTEGER" primary_key: true autoincrement: true }];
  string method_id = 2 [(sqlite_column) = { sql_type: "TEXT" not_null: true }];
  string name = 3 [(sqlite_column) = { sql_type: "TEXT" not_null: true }];
  int64 count = 4 [(sqlite_column) = { sql_type: "INTEGER" not_null: true }];
  int64 weight = 5 [(sqlite_column) = { sql_type: "INTEGER" not_null: true }];
}

message EvidenceRangeRow {
  option (sqlite_table).name = "evidence_ranges";

  int64 id = 1 [(sqlite_column) = { sql_type: "INTEGER" primary_key: true autoincrement: true }];
  string method_id = 2 [(sqlite_column) = { sql_type: "TEXT" not_null: true }];
  string file = 3 [(sqlite_column) = { sql_type: "TEXT" not_null: true }];
  int64 start_line = 4 [(sqlite_column) = { sql_type: "INTEGER" not_null: true }];
  int64 end_line = 5 [(sqlite_column) = { sql_type: "INTEGER" not_null: true }];
  string source = 6 [(sqlite_column) = { sql_type: "TEXT" not_null: true }];
}

message ContextPacketRow {
  option (sqlite_table).name = "context_packets";

  string method_id = 1 [(sqlite_column) = { sql_type: "TEXT" primary_key: true }];
  string summary = 2 [(sqlite_column) = { sql_type: "TEXT" not_null: true }];
}

message DiagnosticRow {
  option (sqlite_table).name = "diagnostics";

  int64 id = 1 [(sqlite_column) = { sql_type: "INTEGER" primary_key: true autoincrement: true }];
  string severity = 2 [(sqlite_column) = { sql_type: "TEXT" not_null: true }];
  string category = 3 [(sqlite_column) = { sql_type: "TEXT" not_null: true }];
  string message = 4 [(sqlite_column) = { sql_type: "TEXT" not_null: true }];
  optional string file = 5 [(sqlite_column).sql_type = "TEXT"];
  optional string command_json = 6 [(sqlite_column).sql_type = "TEXT"];
  optional int64 exit_code = 7 [(sqlite_column).sql_type = "INTEGER"];
  optional string stderr = 8 [(sqlite_column).sql_type = "TEXT"];
}

message TestSuiteRow {
  option (sqlite_table).name = "test_suites";

  string id = 1 [(sqlite_column) = { sql_type: "TEXT" primary_key: true }];
  optional string module_id = 2 [(sqlite_column).sql_type = "TEXT"];
  string class_name = 3 [(sqlite_column) = { sql_type: "TEXT" not_null: true }];
  optional string package_name = 4 [(sqlite_column).sql_type = "TEXT"];
  string qualified_name = 5 [(sqlite_column) = { sql_type: "TEXT" not_null: true }];
  string test_kind = 6 [(sqlite_column) = { sql_type: "TEXT" not_null: true }];
  string file = 7 [(sqlite_column) = { sql_type: "TEXT" not_null: true }];
  int64 start_line = 8 [(sqlite_column) = { sql_type: "INTEGER" not_null: true }];
  int64 end_line = 9 [(sqlite_column) = { sql_type: "INTEGER" not_null: true }];
  string annotations_json = 10 [(sqlite_column) = { sql_type: "TEXT" not_null: true }];
}

message TestCaseRow {
  option (sqlite_table).name = "test_cases";

  string id = 1 [(sqlite_column) = { sql_type: "TEXT" primary_key: true }];
  string suite_id = 2 [(sqlite_column) = { sql_type: "TEXT" not_null: true references_table: "test_suites" references_column: "id" }];
  string name = 3 [(sqlite_column) = { sql_type: "TEXT" not_null: true }];
  optional string display_name = 4 [(sqlite_column).sql_type = "TEXT"];
  string test_kind = 5 [(sqlite_column) = { sql_type: "TEXT" not_null: true }];
  string file = 6 [(sqlite_column) = { sql_type: "TEXT" not_null: true }];
  int64 start_line = 7 [(sqlite_column) = { sql_type: "INTEGER" not_null: true }];
  int64 end_line = 8 [(sqlite_column) = { sql_type: "INTEGER" not_null: true }];
  string annotations_json = 9 [(sqlite_column) = { sql_type: "TEXT" not_null: true }];
  string body_text = 10 [(sqlite_column) = { sql_type: "TEXT" not_null: true }];
}

message TestTargetRow {
  option (sqlite_table).name = "test_targets";

  int64 id = 1 [(sqlite_column) = { sql_type: "INTEGER" primary_key: true autoincrement: true }];
  string test_case_id = 2 [(sqlite_column) = { sql_type: "TEXT" not_null: true references_table: "test_cases" references_column: "id" }];
  string target_kind = 3 [(sqlite_column) = { sql_type: "TEXT" not_null: true }];
  string target_id = 4 [(sqlite_column) = { sql_type: "TEXT" not_null: true }];
  string relationship = 5 [(sqlite_column) = { sql_type: "TEXT" not_null: true }];
  double confidence = 6 [(sqlite_column) = { sql_type: "REAL" not_null: true }];
  string source = 7 [(sqlite_column) = { sql_type: "TEXT" not_null: true }];
}

message TestAssertionRow {
  option (sqlite_table).name = "test_assertions";

  int64 id = 1 [(sqlite_column) = { sql_type: "INTEGER" primary_key: true autoincrement: true }];
  string test_case_id = 2 [(sqlite_column) = { sql_type: "TEXT" not_null: true references_table: "test_cases" references_column: "id" }];
  string assertion_kind = 3 [(sqlite_column) = { sql_type: "TEXT" not_null: true }];
  string expression = 4 [(sqlite_column) = { sql_type: "TEXT" not_null: true }];
  optional string expected_value = 5 [(sqlite_column).sql_type = "TEXT"];
  string file = 6 [(sqlite_column) = { sql_type: "TEXT" not_null: true }];
  int64 line = 7 [(sqlite_column) = { sql_type: "INTEGER" not_null: true }];
}

message TestFixtureRow {
  option (sqlite_table).name = "test_fixtures";

  int64 id = 1 [(sqlite_column) = { sql_type: "INTEGER" primary_key: true autoincrement: true }];
  optional string suite_id = 2 [(sqlite_column) = { sql_type: "TEXT" references_table: "test_suites" references_column: "id" }];
  optional string test_case_id = 3 [(sqlite_column) = { sql_type: "TEXT" references_table: "test_cases" references_column: "id" }];
  string fixture_kind = 4 [(sqlite_column) = { sql_type: "TEXT" not_null: true }];
  string name = 5 [(sqlite_column) = { sql_type: "TEXT" not_null: true }];
  string details_json = 6 [(sqlite_column) = { sql_type: "TEXT" not_null: true }];
  string file = 7 [(sqlite_column) = { sql_type: "TEXT" not_null: true }];
  int64 line = 8 [(sqlite_column) = { sql_type: "INTEGER" not_null: true }];
}

message TestEntryPointRow {
  option (sqlite_table).name = "test_entry_points";

  int64 id = 1 [(sqlite_column) = { sql_type: "INTEGER" primary_key: true autoincrement: true }];
  string test_case_id = 2 [(sqlite_column) = { sql_type: "TEXT" not_null: true references_table: "test_cases" references_column: "id" }];
  string kind = 3 [(sqlite_column) = { sql_type: "TEXT" not_null: true }];
  optional string framework = 4 [(sqlite_column).sql_type = "TEXT"];
  optional string route = 5 [(sqlite_column).sql_type = "TEXT"];
  optional string http_method = 6 [(sqlite_column).sql_type = "TEXT"];
  optional string topic = 7 [(sqlite_column).sql_type = "TEXT"];
  optional string command = 8 [(sqlite_column).sql_type = "TEXT"];
  string source = 9 [(sqlite_column) = { sql_type: "TEXT" not_null: true }];
}

message TestDiagnosticRow {
  option (sqlite_table).name = "test_diagnostics";

  int64 id = 1 [(sqlite_column) = { sql_type: "INTEGER" primary_key: true autoincrement: true }];
  string severity = 2 [(sqlite_column) = { sql_type: "TEXT" not_null: true }];
  string category = 3 [(sqlite_column) = { sql_type: "TEXT" not_null: true }];
  string message = 4 [(sqlite_column) = { sql_type: "TEXT" not_null: true }];
  optional string file = 5 [(sqlite_column).sql_type = "TEXT"];
}
