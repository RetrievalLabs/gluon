syntax = "proto3";

package gluon.db.v1;

import "gluon/db/v1/sqlite.proto";

// Shared contract for characterization-tests.db.
//
// Code-parser owns SQLite DDL and migrations. Harness uses this contract to
// avoid inventing table, column, and lifecycle names independently.

enum CharacterizationRunStatus {
  CHARACTERIZATION_RUN_STATUS_UNSPECIFIED = 0;
  CHARACTERIZATION_RUN_STATUS_RUNNING = 1;
  CHARACTERIZATION_RUN_STATUS_COMPLETED = 2;
  CHARACTERIZATION_RUN_STATUS_FAILED = 3;
  CHARACTERIZATION_RUN_STATUS_PARTIAL_FAILURE = 4;
}

enum CharacterizationBehaviorStatus {
  CHARACTERIZATION_BEHAVIOR_STATUS_UNSPECIFIED = 0;
  CHARACTERIZATION_BEHAVIOR_STATUS_SELECTED = 1;
  CHARACTERIZATION_BEHAVIOR_STATUS_SKIPPED = 2;
}

enum CharacterizationScenarioStatus {
  CHARACTERIZATION_SCENARIO_STATUS_UNSPECIFIED = 0;
  CHARACTERIZATION_SCENARIO_STATUS_GENERATED_SCAFFOLD = 1;
  CHARACTERIZATION_SCENARIO_STATUS_IMPLEMENTING = 2;
  CHARACTERIZATION_SCENARIO_STATUS_OBSERVING = 3;
  CHARACTERIZATION_SCENARIO_STATUS_ACCEPTED = 4;
  CHARACTERIZATION_SCENARIO_STATUS_COMMITTED = 5;
  CHARACTERIZATION_SCENARIO_STATUS_SKIPPED = 6;
  CHARACTERIZATION_SCENARIO_STATUS_FAILED = 7;
}

enum CharacterizationScenarioKind {
  CHARACTERIZATION_SCENARIO_KIND_UNSPECIFIED = 0;
  CHARACTERIZATION_SCENARIO_KIND_SCAFFOLD = 1;
  CHARACTERIZATION_SCENARIO_KIND_HAPPY_PATH = 2;
  CHARACTERIZATION_SCENARIO_KIND_EDGE = 3;
  CHARACTERIZATION_SCENARIO_KIND_BOUNDARY = 4;
  CHARACTERIZATION_SCENARIO_KIND_FAILURE = 5;
}

enum CharacterizationObservationStatus {
  CHARACTERIZATION_OBSERVATION_STATUS_UNSPECIFIED = 0;
  CHARACTERIZATION_OBSERVATION_STATUS_OBSERVED = 1;
  CHARACTERIZATION_OBSERVATION_STATUS_FAILED = 2;
}

enum CharacterizationDiagnosticSeverity {
  CHARACTERIZATION_DIAGNOSTIC_SEVERITY_UNSPECIFIED = 0;
  CHARACTERIZATION_DIAGNOSTIC_SEVERITY_INFO = 1;
  CHARACTERIZATION_DIAGNOSTIC_SEVERITY_WARNING = 2;
  CHARACTERIZATION_DIAGNOSTIC_SEVERITY_ERROR = 3;
}

enum CharacterizationTable {
  CHARACTERIZATION_TABLE_UNSPECIFIED = 0;
  CHARACTERIZATION_TABLE_RUNS = 1;
  CHARACTERIZATION_TABLE_BEHAVIORS = 2;
  CHARACTERIZATION_TABLE_SCENARIOS = 3;
  CHARACTERIZATION_TABLE_INPUTS = 4;
  CHARACTERIZATION_TABLE_OBSERVATIONS = 5;
  CHARACTERIZATION_TABLE_FILES = 6;
  CHARACTERIZATION_TABLE_FAKES = 7;
  CHARACTERIZATION_TABLE_DIAGNOSTICS = 8;
}

message CharacterizationRunRow {
  option (sqlite_table).name = "characterization_runs";

  int64 id = 1 [(sqlite_column) = { sql_type: "INTEGER" primary_key: true autoincrement: true }];
  string mode = 2 [(sqlite_column) = { sql_type: "TEXT" not_null: true }];
  string source_path = 3 [(sqlite_column) = { sql_type: "TEXT" not_null: true }];
  string business_database_path = 4 [(sqlite_column) = { sql_type: "TEXT" not_null: true }];
  string kg_database_path = 5 [(sqlite_column) = { sql_type: "TEXT" not_null: true }];
  CharacterizationRunStatus status = 6 [(sqlite_column) = { sql_type: "TEXT" not_null: true }];
  string started_at = 7 [(sqlite_column) = { sql_type: "TEXT" not_null: true }];
  optional string finished_at = 8 [(sqlite_column).sql_type = "TEXT"];
  int64 selected_behaviors = 9 [(sqlite_column) = { sql_type: "INTEGER" default_sql: "0" }];
  int64 persisted_behaviors = 10 [(sqlite_column) = { sql_type: "INTEGER" default_sql: "0" }];
  int64 skipped_behaviors = 11 [(sqlite_column) = { sql_type: "INTEGER" default_sql: "0" }];
  int64 diagnostics = 12 [(sqlite_column) = { sql_type: "INTEGER" default_sql: "0" }];
}

message CharacterizationBehaviorRow {
  option (sqlite_table).name = "characterization_behaviors";

  string id = 1 [(sqlite_column) = { sql_type: "TEXT" primary_key: true }];
  int64 run_id = 2 [(sqlite_column) = { sql_type: "INTEGER" not_null: true references_table: "characterization_runs" references_column: "id" }];
  string kg_node_id = 3 [(sqlite_column) = { sql_type: "TEXT" not_null: true }];
  string node_kind = 4 [(sqlite_column) = { sql_type: "TEXT" not_null: true }];
  string node_name = 5 [(sqlite_column) = { sql_type: "TEXT" not_null: true }];
  string node_statement = 6 [(sqlite_column) = { sql_type: "TEXT" not_null: true }];
  string source_method_ids_json = 7 [(sqlite_column) = { sql_type: "TEXT" not_null: true }];
  CharacterizationBehaviorStatus status = 8 [(sqlite_column) = { sql_type: "TEXT" not_null: true }];
}

message CharacterizationScenarioRow {
  option (sqlite_table).name = "characterization_scenarios";

  string id = 1 [(sqlite_column) = { sql_type: "TEXT" primary_key: true }];
  int64 run_id = 2 [(sqlite_column) = { sql_type: "INTEGER" not_null: true references_table: "characterization_runs" references_column: "id" }];
  string behavior_id = 3 [(sqlite_column) = { sql_type: "TEXT" not_null: true references_table: "characterization_behaviors" references_column: "id" }];
  string name = 4 [(sqlite_column) = { sql_type: "TEXT" not_null: true }];
  CharacterizationScenarioKind scenario_kind = 5 [(sqlite_column) = { sql_type: "TEXT" not_null: true }];
  optional string invocation_kind = 6 [(sqlite_column).sql_type = "TEXT"];
  CharacterizationScenarioStatus status = 7 [(sqlite_column) = { sql_type: "TEXT" not_null: true }];
  optional string diagnostic_reason = 8 [(sqlite_column).sql_type = "TEXT"];
}

message CharacterizationInputRow {
  option (sqlite_table).name = "characterization_inputs";

  string id = 1 [(sqlite_column) = { sql_type: "TEXT" primary_key: true }];
  string scenario_id = 2 [(sqlite_column) = { sql_type: "TEXT" not_null: true references_table: "characterization_scenarios" references_column: "id" }];
  string input_json = 3 [(sqlite_column) = { sql_type: "TEXT" not_null: true }];
  string fixture_json = 4 [(sqlite_column) = { sql_type: "TEXT" not_null: true }];
  string deterministic_seed_json = 5 [(sqlite_column) = { sql_type: "TEXT" not_null: true }];
}

message CharacterizationObservationRow {
  option (sqlite_table).name = "characterization_observations";

  string id = 1 [(sqlite_column) = { sql_type: "TEXT" primary_key: true }];
  string scenario_id = 2 [(sqlite_column) = { sql_type: "TEXT" not_null: true references_table: "characterization_scenarios" references_column: "id" }];
  string input_id = 3 [(sqlite_column) = { sql_type: "TEXT" not_null: true references_table: "characterization_inputs" references_column: "id" }];
  CharacterizationObservationStatus status = 4 [(sqlite_column) = { sql_type: "TEXT" not_null: true }];
  optional string return_value_json = 5 [(sqlite_column).sql_type = "TEXT"];
  optional string response_body = 6 [(sqlite_column).sql_type = "TEXT"];
  optional string exception_type = 7 [(sqlite_column).sql_type = "TEXT"];
  optional string exception_message = 8 [(sqlite_column).sql_type = "TEXT"];
  string emitted_events_json = 9 [(sqlite_column) = { sql_type: "TEXT" not_null: true default_sql: "'[]'" }];
  string database_side_effects_json = 10 [(sqlite_column) = { sql_type: "TEXT" not_null: true default_sql: "'[]'" }];
  string fake_boundary_calls_json = 11 [(sqlite_column) = { sql_type: "TEXT" not_null: true default_sql: "'[]'" }];
  string normalized_output_json = 12 [(sqlite_column) = { sql_type: "TEXT" not_null: true }];
}

message CharacterizationFileRow {
  option (sqlite_table).name = "characterization_files";

  int64 id = 1 [(sqlite_column) = { sql_type: "INTEGER" primary_key: true autoincrement: true }];
  string scenario_id = 2 [(sqlite_column) = { sql_type: "TEXT" not_null: true references_table: "characterization_scenarios" references_column: "id" }];
  string path = 3 [(sqlite_column) = { sql_type: "TEXT" not_null: true }];
  string class_name = 4 [(sqlite_column) = { sql_type: "TEXT" not_null: true }];
  string package_name = 5 [(sqlite_column) = { sql_type: "TEXT" not_null: true }];
  string content_hash = 6 [(sqlite_column) = { sql_type: "TEXT" not_null: true }];
  string generated_marker = 7 [(sqlite_column) = { sql_type: "TEXT" not_null: true }];
}

message CharacterizationFakeRow {
  option (sqlite_table).name = "characterization_fakes";

  int64 id = 1 [(sqlite_column) = { sql_type: "INTEGER" primary_key: true autoincrement: true }];
  string scenario_id = 2 [(sqlite_column) = { sql_type: "TEXT" not_null: true references_table: "characterization_scenarios" references_column: "id" }];
  string dependency_name = 3 [(sqlite_column) = { sql_type: "TEXT" not_null: true }];
  string fake_strategy = 4 [(sqlite_column) = { sql_type: "TEXT" not_null: true }];
  optional string source_file_path = 5 [(sqlite_column).sql_type = "TEXT"];
  string boundary_calls_json = 6 [(sqlite_column) = { sql_type: "TEXT" not_null: true default_sql: "'[]'" }];
}

message CharacterizationDiagnosticRow {
  option (sqlite_table).name = "characterization_diagnostics";

  int64 id = 1 [(sqlite_column) = { sql_type: "INTEGER" primary_key: true autoincrement: true }];
  int64 run_id = 2 [(sqlite_column) = { sql_type: "INTEGER" not_null: true references_table: "characterization_runs" references_column: "id" }];
  optional string behavior_id = 3 [(sqlite_column).sql_type = "TEXT"];
  optional string kg_node_id = 4 [(sqlite_column).sql_type = "TEXT"];
  optional string scenario_id = 5 [(sqlite_column).sql_type = "TEXT"];
  CharacterizationDiagnosticSeverity severity = 6 [(sqlite_column) = { sql_type: "TEXT" not_null: true }];
  string category = 7 [(sqlite_column) = { sql_type: "TEXT" not_null: true }];
  string message = 8 [(sqlite_column) = { sql_type: "TEXT" not_null: true }];
}
